name: Package standalone distribution

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Validate and package portable distributions
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'
          cache: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          check-latest: false

      - name: Install and verify pinned dependencies
        run: |
          set -euo pipefail
          npm run toolchain:verify
          npm ci
          npm run deps:prepare
          npm run deps:verify

      - name: Run fast gates before the expensive build
        run: |
          set -euo pipefail
          python3 scripts/verify-baseline.py --json
          npm run test:fast

      - name: Build and verify production distribution
        run: |
          set -euo pipefail
          npm run build:prod
          npm run test:unit:ci
          python3 -m unittest tests.test_standalone_build
          npm run build:launchers
          npm run build:verify
          npm run install:chromedriver
          npm run test:e2e:prod

      - name: Package and verify portable distributions
        run: |
          set -euo pipefail
          npm run release:package
          npm run release:verify

      - name: Upload verified portable packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0 # v7.0.1
        with:
          name: aosp-winscope-release-${{ github.sha }}
          path: dist/release
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

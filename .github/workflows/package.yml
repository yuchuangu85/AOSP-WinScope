name: Package standalone distribution

on:
  workflow_dispatch:
    inputs:
      native_installers:
        description: Build native installers for all supported platforms
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Validate and package universal distribution
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'
          cache: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          check-latest: false

      - name: Install and verify pinned dependencies
        run: |
          set -euo pipefail
          npm run toolchain:verify
          npm ci
          npm run deps:prepare
          npm run deps:verify

      - name: Run fast gates before the expensive build
        run: |
          set -euo pipefail
          python3 scripts/verify-baseline.py --json
          npm run test:fast

      - name: Build and verify production distribution
        run: |
          set -euo pipefail
          npm run build:prod
          npm run test:unit:ci
          python3 -m unittest tests.test_standalone_build
          npm run build:launchers
          npm run build:verify
          npm run test:e2e:prod

      - name: Package and verify universal distribution
        run: |
          set -euo pipefail
          npm run release:package
          npm run release:verify

      - name: Upload verified universal package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aosp-winscope-release-${{ github.sha }}
          path: dist/release
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  native-installers:
    name: Package ${{ matrix.platform }}-${{ matrix.architecture }} installers
    if: ${{ inputs.native_installers }}
    needs: package
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            architecture: arm64
            runner: macos-14
            formats: dmg,pkg
          - platform: macos
            architecture: amd64
            runner: macos-15-intel
            formats: dmg,pkg
          - platform: windows
            architecture: amd64
            runner: windows-2022
            formats: exe,msi
          - platform: linux
            architecture: amd64
            runner: ubuntu-24.04
            formats: deb,rpm
          - platform: linux
            architecture: arm64
            runner: ubuntu-24.04-arm
            formats: deb,rpm

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          check-latest: false

      - name: Download verified universal package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: aosp-winscope-release-${{ github.sha }}
          path: dist/release

      - name: Install Windows installer tools
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          choco install innosetup --no-progress --yes
          dotnet tool install --global wix --version 6.0.2
          Add-Content -Path $env:GITHUB_PATH -Value "$HOME\.dotnet\tools"

      - name: Install Linux installer tools
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes rpm

      - name: Build native installer artifacts
        if: matrix.platform != 'windows'
        shell: bash
        run: |
          python3 scripts/package-installers.py \
            --input dist/release/aosp-winscope-17.0.1 \
            --platform '${{ matrix.platform }}' \
            --architecture '${{ matrix.architecture }}' \
            --formats '${{ matrix.formats }}' \
            --output dist/installers

      - name: Build native installer artifacts
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python scripts/package-installers.py `
            --input dist/release/aosp-winscope-17.0.1 `
            --platform '${{ matrix.platform }}' `
            --architecture '${{ matrix.architecture }}' `
            --formats '${{ matrix.formats }}' `
            --output dist/installers

      - name: Upload native installer artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aosp-winscope-${{ matrix.platform }}-${{ matrix.architecture }}-${{ github.sha }}
          path: dist/installers
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

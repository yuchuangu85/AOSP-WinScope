name: Publish desktop release

# Publish only complete, trusted manual builds. PR packaging stays read-only.
on:
  workflow_run:
    workflows: [Electron desktop candidates]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'workflow_dispatch' &&
          github.event.workflow_run.head_repository.full_name == github.repository &&
          github.event.workflow_run.head_branch == github.event.repository.default_branch }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      actions: read
      contents: write
    defaults:
      run:
        shell: bash
    env:
      GH_REPO: ${{ github.repository }}
      SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
      SOURCE_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Validate the successful source run before reading its code
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          gh api "repos/$GH_REPO/actions/runs/$SOURCE_RUN_ID" > "$RUNNER_TEMP/source-run.json"
          node --input-type=module <<'JS'
          import fs from "node:fs";
          import assert from "node:assert/strict";
          const run = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/source-run.json", "utf8"));
          assert.equal(String(run.id), process.env.SOURCE_RUN_ID);
          assert.equal(String(run.run_attempt), process.env.SOURCE_RUN_ATTEMPT);
          assert.equal(run.name, "Electron desktop candidates");
          assert.equal(run.path, ".github/workflows/electron.yml");
          assert.equal(run.status, "completed");
          assert.equal(run.conclusion, "success");
          assert.equal(run.event, "workflow_dispatch");
          assert.equal(run.repository.full_name, process.env.GH_REPO);
          assert.equal(run.head_repository.full_name, process.env.GH_REPO);
          assert.equal(run.head_branch, process.env.DEFAULT_BRANCH);
          assert.equal(run.head_sha, process.env.SOURCE_SHA);
          JS

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require the exact source commit on the default branch
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git merge-base --is-ancestor "$SOURCE_SHA" "origin/$DEFAULT_BRANCH"
          # GITHUB_TOKEN cannot obtain Workflows: write to release a commit
          # whose workflow tree differs from the current default branch.
          if ! git diff --quiet "$SOURCE_SHA" "origin/$DEFAULT_BRANCH" -- .github/workflows; then
            echo "Default-branch workflows changed; package the current branch again" >&2
            exit 1
          fi

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Resolve the version and unique candidate tag
        id: identity
        run: |
          set -euo pipefail
          node desktop/release.mjs plan --commit "$SOURCE_SHA" --github-output "$GITHUB_OUTPUT"
          version=$(node -p 'require("./package.json").version')
          printf 'tag=v%s-desktop.%s\n' "$version" "$SOURCE_RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Download only the verified aggregate from that run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ steps.identity.outputs.publication-artifact }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          # Keep downloaded data outside the executable source checkout.
          path: ${{ runner.temp }}/desktop-publication

      - name: Reverify all targets, installers, source, acceptance and checksums
        env:
          DESKTOP_VERSION: ${{ steps.identity.outputs.version }}
        run: |
          set -euo pipefail
          node desktop/release.mjs verify --directory "$RUNNER_TEMP/desktop-publication" \
            --version "$DESKTOP_VERSION" --commit "$SOURCE_SHA"

      - name: Create a new tag and unpublished draft without overwriting releases
        env:
          GH_TOKEN: ${{ github.token }}
          DESKTOP_VERSION: ${{ steps.identity.outputs.version }}
          RELEASE_TAG: ${{ steps.identity.outputs.tag }}
        run: |
          set -euo pipefail
          # Listing errors and remote lookup failures must stop publication too.
          gh api --paginate "repos/$GH_REPO/releases?per_page=100" \
            --jq '.[].tag_name' > "$RUNNER_TEMP/release-tags"
          if grep -Fxq -- "$RELEASE_TAG" "$RUNNER_TEMP/release-tags"; then
            echo "Release already exists: $RELEASE_TAG" >&2
            exit 1
          fi
          existing=$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG")
          if [[ -n "$existing" ]]; then
            echo "Tag already exists: $RELEASE_TAG" >&2
            exit 1
          fi
          # A draft needs an existing tag; otherwise GitHub can leave it untagged.
          created=$(gh api -X POST "repos/$GH_REPO/git/refs" \
            -f ref="refs/tags/$RELEASE_TAG" -f sha="$SOURCE_SHA" --jq '.object.sha')
          test "$created" = "$SOURCE_SHA"
          cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          ## AOSP-WinScope $DESKTOP_VERSION desktop candidate

          Built from commit $SOURCE_SHA by the complete five-target packaging run:
          https://github.com/$GH_REPO/actions/runs/$SOURCE_RUN_ID

          Includes ten native installers, Linux ARM64 application source, per-target
          acceptance reports, desktop-release.json, and desktop-SHA256SUMS.txt.

          This is an automated candidate pre-release, not official release approval.
          Packages have no authenticated OS publisher signature or Apple notarization;
          this workflow supplies no official OIDC attestation. See docs/ELECTRON.md
          at the source commit for compatibility, installation, and trust boundaries.
          EOF
          gh release create "$RELEASE_TAG" "$RUNNER_TEMP/desktop-publication"/* \
            --draft --prerelease --latest=false --verify-tag \
            --title "AOSP-WinScope $DESKTOP_VERSION desktop candidate" \
            --notes-file "$RUNNER_TEMP/release-notes.md"

      - name: Verify the uploaded draft and exact tag before public visibility
        env:
          GH_TOKEN: ${{ github.token }}
          DESKTOP_VERSION: ${{ steps.identity.outputs.version }}
          RELEASE_TAG: ${{ steps.identity.outputs.tag }}
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/releases/tags/$RELEASE_TAG" > "$RUNNER_TEMP/uploaded-release.json"
          node desktop/release.mjs check-remote --desktop "$RUNNER_TEMP/desktop-publication" \
            --metadata "$RUNNER_TEMP/uploaded-release.json" \
            --version "$DESKTOP_VERSION" --commit "$SOURCE_SHA" --tag "$RELEASE_TAG"
          remote_sha=$(gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')
          test "$remote_sha" = "$SOURCE_SHA"

      - name: Publish the verified candidate pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.identity.outputs.tag }}
        run: |
          set -euo pipefail
          gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false
          gh release view "$RELEASE_TAG" --json url --jq '.url' >> "$GITHUB_STEP_SUMMARY"

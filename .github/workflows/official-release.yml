name: Official release

on:
  push:
    tags:
      - 'v17.*'

permissions:
  contents: read

concurrency:
  group: official-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-24.04
    environment: official-release
    permissions:
      contents: read
    outputs:
      prerelease: ${{ steps.contract.outputs.prerelease }}
      release-image: ${{ steps.contract.outputs.release-image }}
      version: ${{ steps.contract.outputs.version }}
    steps:
      - name: Verify immutable release contract
        id: contract
        env:
          OFFICIAL_RELEASE_IMAGE: ${{ vars.OFFICIAL_RELEASE_IMAGE }}
        run: |
          set -euo pipefail
          if [[ ! "$OFFICIAL_RELEASE_IMAGE" =~ ^[a-z0-9][a-z0-9._/-]*@sha256:[0-9a-f]{64}$ ]]; then
            echo "OFFICIAL_RELEASE_IMAGE must use an immutable sha256 digest" >&2
            exit 1
          fi
          if [[ ! "$GITHUB_REF_NAME" =~ ^v17\.[0-9]+\.[0-9]+(-(alpha|rc)\.[0-9]+)?$ ]]; then
            echo "Unsupported release tag: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          {
            echo "prerelease=$([[ "$GITHUB_REF_NAME" == *-alpha.* || "$GITHUB_REF_NAME" == *-rc.* ]] && echo true || echo false)"
            echo "release-image=$OFFICIAL_RELEASE_IMAGE"
            echo "version=${GITHUB_REF_NAME#v}"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Verify official release image
        env:
          OFFICIAL_RELEASE_IMAGE: ${{ vars.OFFICIAL_RELEASE_IMAGE }}
        run: |
          set -euo pipefail
          python3 scripts/verify-release-image.py --image "$OFFICIAL_RELEASE_IMAGE" --output dist/validation/release-image.json --json

      - name: Transfer release image evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: official-release-image-${{ steps.contract.outputs.version }}
          path: dist/validation/release-image.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  build:
    needs: preflight
    runs-on: ubuntu-24.04
    environment: official-release
    container:
      image: ${{ needs.preflight.outputs.release-image }}
    env:
      AOSP_WINSCOPE_VERSION: ${{ needs.preflight.outputs.version }}
      OFFICIAL_RELEASE_IMAGE: ${{ needs.preflight.outputs.release-image }}
      PUBLICATION_DIR: dist/public/${{ needs.preflight.outputs.version }}
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download release image evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: official-release-image-${{ needs.preflight.outputs.version }}
          path: dist/validation

      - name: Verify tagged source and clean-room lineage
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          python3 scripts/verify-baseline.py --json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'
          cache: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          check-latest: false

      - name: Install the pinned npm release
        shell: bash
        run: |
          set -euo pipefail
          npm install --global "npm@$(node -p 'require("./package.json").engines.npm')"
          npm --version

      - name: Verify release image tools
        run: |
          set -euo pipefail
          command -v git
          command -v gh
          command -v google-chrome
          npm run toolchain:verify

      - name: Refuse an existing release before building
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists and cannot be overwritten: $GITHUB_REF_NAME" >&2
            exit 1
          fi

      - name: Prepare pinned dependencies
        run: |
          set -euo pipefail
          npm ci
          npm run deps:prepare
          npm run deps:verify

      - name: Build and reproduce release
        run: |
          set -euo pipefail
          npm run build:prod
          npm run build:launchers
          npm run features:verify
          npm run release:double-build -- --version "$AOSP_WINSCOPE_VERSION"
          npm run release:package -- --version "$AOSP_WINSCOPE_VERSION"

      - name: Materialize approved external evidence
        env:
          ANDROID17_DEVICE_EVIDENCE_B64: ${{ secrets.ANDROID17_DEVICE_EVIDENCE_B64 }}
          VULNERABILITY_EVIDENCE_B64: ${{ secrets.VULNERABILITY_EVIDENCE_B64 }}
          PERFORMANCE_BASELINE_B64: ${{ secrets.PERFORMANCE_BASELINE_B64 }}
          PERFORMANCE_BENCHMARK_B64: ${{ secrets.PERFORMANCE_BENCHMARK_B64 }}
        run: |
          set -euo pipefail
          mkdir -p dist/validation/external
          write_evidence() {
            local variable="$1"
            local destination="$2"
            local value="${!variable:-}"
            if [[ -z "$value" ]]; then
              echo "Missing protected environment evidence: $variable" >&2
              exit 1
            fi
            printf '%s' "$value" | base64 --decode > "$destination"
            python3 -m json.tool "$destination" >/dev/null
          }
          write_evidence ANDROID17_DEVICE_EVIDENCE_B64 dist/validation/external/android17-device.json
          write_evidence VULNERABILITY_EVIDENCE_B64 dist/validation/external/vulnerability.json
          write_evidence PERFORMANCE_BASELINE_B64 dist/validation/external/performance-baseline.json
          write_evidence PERFORMANCE_BENCHMARK_B64 dist/validation/external/performance-benchmark.json

      - name: Run complete release gate
        run: |
          set -euo pipefail
          python3 scripts/validate.py gate \
            --json \
            --require-complete \
            --web dist/prod \
            --release "dist/release" \
            --reproducibility dist/validation/reproducibility.json \
            --device-evidence dist/validation/external/android17-device.json \
            --vulnerability-evidence dist/validation/external/vulnerability.json \
            --baseline dist/validation/external/performance-baseline.json \
            --benchmark dist/validation/external/performance-benchmark.json \
            --run-unit \
            --run-e2e \
            --run-production-e2e \
            --run-offline \
            --run-security

      - name: Stage immutable publication
        run: |
          set -euo pipefail
          python3 scripts/publish.py publish \
            --version "$AOSP_WINSCOPE_VERSION" \
            --tag "$GITHUB_REF_NAME" \
            --build-image "$OFFICIAL_RELEASE_IMAGE" \
            --release-image-report dist/validation/release-image.json \
            --json
          python3 scripts/publish.py verify \
            --index "$PUBLICATION_DIR/release-index.json" \
            --json

      - name: Transfer verified publication
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: official-release-${{ needs.preflight.outputs.version }}
          path: dist/public/${{ needs.preflight.outputs.version }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Build and verify AI against the canonical gated Web build
        run: |
          set -euo pipefail
          npm run build:verify
          npm run ai:build
          npm run ai:verify
          node --test ai/dist/src/test/*.test.js
          npm run desktop:test
          go test -race -count=1 ./cmd/launcher
          go vet ./cmd/launcher
          python3 -m unittest tests.test_desktop_capture_shutdown tests.test_security
          python3 -m unittest discover -s desktop -p '*_test.py'

      - name: Transfer canonical Web and compiled AI for native desktop packaging
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: electron-shared-${{ github.sha }}
          path: |
            dist/prod
            ai/dist
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  desktop:
    needs: [preflight, build]
    permissions:
      contents: read
    uses: ./.github/workflows/electron.yml
    with:
      release-version: ${{ needs.preflight.outputs.version }}
      shared-artifact: electron-shared-${{ github.sha }}

  publish:
    needs: [preflight, build, desktop]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: official-release
    env:
      AOSP_WINSCOPE_VERSION: ${{ needs.preflight.outputs.version }}
      IS_PRERELEASE: ${{ needs.preflight.outputs.prerelease }}
      OFFICIAL_RELEASE_IMAGE: ${{ needs.preflight.outputs.release-image }}
      PUBLICATION_DIR: dist/public/${{ needs.preflight.outputs.version }}
      DESKTOP_PUBLICATION_DIR: dist/desktop/public/${{ needs.preflight.outputs.version }}
    permissions:
      artifact-metadata: write
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          check-latest: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Download verified publication
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: official-release-${{ needs.preflight.outputs.version }}
          path: dist/public/${{ needs.preflight.outputs.version }}

      - name: Download verified desktop publication
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.desktop.outputs.publication-artifact }}
          path: ${{ env.DESKTOP_PUBLICATION_DIR }}

      - name: Reverify publication and release availability
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          python3 scripts/publish.py verify \
            --index "$PUBLICATION_DIR/release-index.json" \
            --json
          INDEX_SHA256=$(python3 -c 'import hashlib,sys; print(hashlib.sha256(open(sys.argv[1], "rb").read()).hexdigest())' \
            "$PUBLICATION_DIR/release-index.json")
          python3 scripts/verify-aps-release.py \
            --publication "$PUBLICATION_DIR" \
            --expected-index-sha256 "$INDEX_SHA256" \
            --expected-build-image "$OFFICIAL_RELEASE_IMAGE" \
            --json
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists and cannot be overwritten: $GITHUB_REF_NAME" >&2
            exit 1
          fi

      - name: Reverify desktop target completeness and installer integrity
        run: |
          set -euo pipefail
          node desktop/release.mjs verify \
            --directory "$DESKTOP_PUBLICATION_DIR" \
            --version "$AOSP_WINSCOPE_VERSION" \
            --commit "$GITHUB_SHA"

      - name: Attest complete publication
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: dist/public/${{ needs.preflight.outputs.version }}/*

      - name: Attest complete desktop publication
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: dist/desktop/public/${{ needs.preflight.outputs.version }}/*

      - name: Create draft and publish only after remote asset verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_args=(
            "$GITHUB_REF_NAME"
            "$PUBLICATION_DIR"/*
            "$DESKTOP_PUBLICATION_DIR"/*
            --repo "$GITHUB_REPOSITORY"
            --draft
            --verify-tag
            --title "AOSP-WinScope $AOSP_WINSCOPE_VERSION"
            --notes "OIDC-attested Android 17 standalone and multi-OS desktop release. Desktop installers are unsigned and are not Apple-notarized. OIDC attestation does not confer Apple trust or platform code signing."
          )
          latest=true
          if [[ "$IS_PRERELEASE" == "true" ]]; then
            release_args+=(--prerelease --latest=false)
            latest=false
          fi
          gh release create "${release_args[@]}"
          mkdir -p dist/validation
          gh api -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" \
            > dist/validation/uploaded-release.json
          release_id=$(node --input-type=module -e '
            import fs from "node:fs";
            const release = JSON.parse(fs.readFileSync("dist/validation/uploaded-release.json", "utf8"));
            if (!Number.isSafeInteger(release.id) || release.id <= 0) {
              throw new Error("Invalid uploaded release ID");
            }
            process.stdout.write(String(release.id));
          ')
          gh api -H 'X-GitHub-Api-Version: 2026-03-10' \
            --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/releases/$release_id/assets?per_page=100" \
            > dist/validation/uploaded-release-assets.json
          node --input-type=module -e '
            import fs from "node:fs";
            const file = "dist/validation/uploaded-release.json";
            const release = JSON.parse(fs.readFileSync(file, "utf8"));
            const pages = JSON.parse(fs.readFileSync("dist/validation/uploaded-release-assets.json", "utf8"));
            if (!Array.isArray(pages) || pages.length === 0 || !pages.every(Array.isArray)) {
              throw new Error("Invalid paginated release assets");
            }
            release.assets = pages.flat();
            fs.writeFileSync(file, JSON.stringify(release) + "\n");
          '
          node desktop/release.mjs check-remote \
            --desktop "$DESKTOP_PUBLICATION_DIR" \
            --portable "$PUBLICATION_DIR" \
            --metadata dist/validation/uploaded-release.json \
            --version "$AOSP_WINSCOPE_VERSION" \
            --commit "$GITHUB_SHA"
          gh release edit "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false \
            --prerelease="$IS_PRERELEASE" \
            --latest="$latest"

name: Fast continuous integration

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate source and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'
          cache: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          check-latest: false

      - name: Verify runner toolchain
        run: |
          set -euo pipefail
          command -v google-chrome
          google-chrome --version
          npm run toolchain:verify

      - name: Install locked JavaScript dependencies
        run: npm ci

      - name: Prepare and verify pinned dependency closure
        run: |
          set -euo pipefail
          npm run deps:prepare
          npm run deps:verify

      - name: Verify source lineage and fast gates
        run: |
          set -euo pipefail
          python3 scripts/verify-baseline.py --json
          npm run test:presubmit
          npx tsc --noEmit -p tsconfig.karma.json
          python3 -m unittest discover -s tests
          go test ./...
          npm run features:verify -- --evidence-only
